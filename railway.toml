# railway.toml — cấu hình deploy lên Railway (Railpack builder)

[deploy]
# Railpack tự detect "start" script từ package.json
# Migration chạy trước khi API khởi động (xem script "start" trong root package.json)
healthcheckPath = "/api/v1/operators/PN/trips?date=2027-01-01"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
